<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">

        <h1 class="heading">Body Mass Index (BMI) Calculator</h1>

        Your height (cm): <input type="number" class="input" id="height" value="180" placeholder="Enter your height in cm">

        Your weight (kg): <input type="number" class="input" id="weight" placeholder="Enter your weight in kgs" value="80">

        <button class="btn" id="btn">Compute BMI</button>

        <input type="text" class="input" id="bmi-result" disabled>

        <h4 class="info-text">Weight condition: <span id="weight-condition"></span></h4>

    </div>

<script src="index.js"></script>
</body>
</html>
